api:
  base-url: "http://rustdesk-api:21114"
  token: "worker-secret-token"

worker:
  name: "builder-1"
  platforms:
    - platform: linux
      arch: x86_64

s3:
  endpoint: "minio:9000"
  access-key: "minioadmin"
  secret-key: "minioadmin"
  bucket: "rustdesk-builds"
  region: "us-east-1"
  use-ssl: false

build:
  # The worker's own clone: cloned from rustdesk-repo-url when missing and
  # reset on every build, so never point it at a checkout you work in.
  rustdesk-src-dir: "/var/lib/build-worker/rustdesk"
  rustdesk-repo-url: "https://github.com/rustdesk/rustdesk.git"
  # The worker's own vcpkg clone, checked out at each release's baseline;
  # packages are cached in <vcpkg-dir>/binary-cache.
  vcpkg-dir: "/var/lib/build-worker/vcpkg"
  vcpkg-repo-url: "https://github.com/microsoft/vcpkg.git"
  # Build parallelism; 0 = all CPUs. Lower it if the final link runs out of memory.
  jobs: 0
  log-dir: "/tmp/build-logs"
  signing-public-key: "fjMWQpn+Kvu2hO6hRjIWyS8n55JITpevt0OzMBRIn4Q="
